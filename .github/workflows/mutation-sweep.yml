name: mutation-sweep

# Mutation sweeps on GitHub-hosted runners (ADR-0008,
# Replikanti/interviewscam#40). Started only by hand on a sweep branch:
#   gh workflow run mutation-sweep.yml --ref <branch> -f mutants=<path>
# Each job runs one shard of the committed mutant file (tools/mutate.py
# shard, through the shim tools/mutate.sh, which the workflow hardening of
# ADR-0007 part 4 requires) and uploads its results as the artifact
# shard-<k>; the agent downloads all 20 and merges them locally with
# `python3 -I -B tools/mutate.py merge <dir>` (part 7). Not a required
# check, and nothing reads its artifacts in a workflow.
on:
  workflow_dispatch:
    inputs:
      mutants:
        description: "The mutant file, tests/mutants/<name>.jsonl"
        required: true
        type: string

permissions:
  contents: read

# Twenty literal jobs, identical but the index, which mutate.py reads from
# GITHUB_JOB (ADR-0008 part 6): a matrix leg could not learn its index,
# because a run step may hold no expression and no job may set its own
# environment (ADR-0007 part 4). test_workflow_shards_identical holds them
# in step.
#
# timeout-minutes, ADR-0008 Numbers ("Job cap"): the factor 2 times the
# slowest green shard job of the acceptance sweeps, rounded up to a
# 5-minute step (ADR-0003 part 5 method). mutate.py stops admitting
# mutants at the deadline D = cap x 60 - 60 s (JOB_TIMEOUT_MIN,
# DEADLINE_MARGIN_S; test_workflow_timeout_matches_deadline), so the cap
# only ever fires on a hang of the runner itself. The upload runs on a
# failed step too, so a partial shard still reports its rows. Retention
# 90 days, the longest a public repo allows: the QA reports and ADR-0008
# cite the runs.
jobs:
  shard-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/mutate.sh --shard
        shell: bash
        run: bash tools/mutate.sh --shard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shard-1
          path: ${{ runner.temp }}/mutate/out
          if-no-files-found: error
          retention-days: 90

  shard-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:

name: ci

# No path filters: branch protection requires the `check` context, and a
# required check must report on every PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Load-bearing name: branch protection requires exactly the context
  # `check`. A rename must update the protection in the same session.
  check:
    runs-on: ubuntu-24.04
    # 3x the first green run, rounded up to whole minutes (ADR-0003 part 5):
    # that run took 107 s (run 41931422101, 2026-11-04, the first with the
    # final reflow check of PR #16), 3 x 107 s = 321 s -> 6 min. The M1 value
    # (22 s -> 2 min) no longer fits: the reflow step and its fixtures start
    # Chrome 25 times. The 360-minute default would let a hung run block
    # merges for hours.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh

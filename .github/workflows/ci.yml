name: ci

# No path filters: branch protection requires the `check` context, and a
# required check must report on every PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Load-bearing name: branch protection requires exactly the context
  # `check`. A rename must update the protection in the same session.
  check:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": re-derived in M4 PR 4
    # (Replikanti/interviewscam#5) from its own green runs of check.sh
    # (reflow case (8), the hit test and paint check, 35 reflow-search rows,
    # 47 render-report rows); the slowest, 919 s (lighthouse.yml build, run
    # 42937840342, stall-free), sets both terms. Cap >= max(2 x 919 s =
    # 1838 s, 919 s + 2 x 75 s (REFLOW_LAUNCH_TIMEOUT) + 70 s = 1139 s),
    # rounded up to 31 min. Re-derive in the next PR that changes check.sh.
    # The 360-minute default would let a hung run block merges for hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh

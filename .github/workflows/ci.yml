name: ci

# No path filters: branch protection requires the `check` context, and a
# required check must report on every PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Load-bearing name: branch protection requires exactly the context
  # `check`. A rename must update the protection in the same session.
  check:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": derived from the job
    # duration, which timeout-minutes counts, on a bucketed base (M5b PR 2
    # fix rounds 9 and 10, Replikanti/interviewscam#13; re-derived in
    # Replikanti/interviewscam#40 PR 2, Replikanti/interviewscam#28 PR 2 and
    # Replikanti/interviewscam#39): the slowest green job, 3163 s (ci.yml
    # check, run 45349613920), plus 46 s of drift, rounded up to the next
    # 5-minute step, 3300 s, sets both terms.
    # Cap >= max(2 x 3300 s = 6600 s, 3300 s + 2 x 75 s
    # (REFLOW_LAUNCH_TIMEOUT) + 70 s = 3520 s), so 110 min. Re-derive only
    # when a green job takes more than 3254 s.
    # The 360-minute default would let a hung run block merges for hours.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh

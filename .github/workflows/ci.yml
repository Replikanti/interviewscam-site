name: ci

# No path filters: branch protection requires the `check` context, and a
# required check must report on every PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Load-bearing name: branch protection requires exactly the context
  # `check`. A rename must update the protection in the same session.
  check:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": derived from the job
    # duration, which timeout-minutes counts, last re-checked in M5b PR 2
    # fix round 8 (Replikanti/interviewscam#13): the slowest green job,
    # 1554 s (lighthouse.yml build, run 43400693223), sets both terms.
    # Cap >= max(2 x 1554 s = 3108 s, 1554 s + 2 x 75 s
    # (REFLOW_LAUNCH_TIMEOUT) + 70 s = 1774 s), rounded up to 52 min.
    # Re-derive in the next PR that changes check.sh.
    # The 360-minute default would let a hung run block merges for hours.
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh

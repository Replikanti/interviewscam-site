name: ci

# No path filters: branch protection requires the `check` context, and a
# required check must report on every PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Load-bearing name: branch protection requires exactly the context
  # `check`. A rename must update the protection in the same session.
  check:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": derived from the job
    # duration, which timeout-minutes counts, on a bucketed base (M5b PR 2
    # fix rounds 9 and 10, Replikanti/interviewscam#13; re-derived in
    # Replikanti/interviewscam#40 PR 2, Replikanti/interviewscam#28 PR 2,
    # Replikanti/interviewscam#39, twice in Replikanti/interviewscam#58 and in
    # Replikanti/interviewscam#34): the slowest green job, 4817 s (ci.yml
    # check, run 45764304803), plus 46 s of drift, rounded up to the next
    # 5-minute step, 5100 s, sets both terms.
    # Cap >= max(2 x 5100 s = 10200 s, 5100 s + 2 x 75 s
    # (REFLOW_LAUNCH_TIMEOUT) + 70 s = 5320 s), so 170 min. Re-derive only
    # when a green job takes more than 5054 s.
    # The 360-minute default would let a hung run block merges for hours.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh

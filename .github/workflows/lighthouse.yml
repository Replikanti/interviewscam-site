name: lighthouse

# The Lighthouse row of SPEC section 8, measured on the built site
# (ADR-0003). The registry code runs only in the job `lighthouse`: its
# GITHUB_TOKEN has no permissions, it has no checkout, and it sees only the
# artifact of `build` (public/, public-fixtures/ and tools/). Nothing on the
# deploy path reads what that job could write, and no workflow restores a
# cache.
#
# Not a required check (ADR-0003 part 4): it needs the public package
# registry on every run, and a registry outage must never block a removal
# PR. Agent sessions still never merge a PR whose run is red or pending.
on:
  pull_request:
    # The site-shaping paths, plus the fixture records the record templates
    # are measured on (ADR-0004 part 10). Record-only PRs are measured by
    # the push run on main after the merge.
    paths:
      - "layouts/**"
      - "assets/**"
      - "static/**"
      - "data/**"
      - "i18n/**"
      - "archetypes/**"
      - "content/*.md"
      - "hugo.toml"
      - "tools/**"
      - "tests/fixtures/records/pass-fixture-site/**"
      - ".github/workflows/lighthouse.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run's result moot.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Load-bearing job names: the guard reads this file, and ADR-0003 names
  # `build` and `lighthouse`.
  build:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": derived from the job
    # duration, which timeout-minutes counts, on a bucketed base (M5b PR 2
    # fix rounds 9 and 10, Replikanti/interviewscam#13): the slowest green
    # job, 1554 s (lighthouse.yml build, run 43400693223), plus 46 s of
    # drift, rounded up to the next 5-minute step, 1800 s, sets both terms.
    # Cap >= max(2 x 1800 s = 3600 s, 1800 s + 2 x 75 s
    # (REFLOW_LAUNCH_TIMEOUT) + 70 s = 2020 s), so 60 min. Re-derive only
    # when a green job takes more than 1754 s.
    # It runs the same check.sh as the check job in ci.yml, plus the
    # artifact upload.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh
      # The checked builds plus the check scripts, nothing else: no
      # content/, no history. public-fixtures/ is the fixture build of
      # check.sh (fixture records only, never deployed). Retention 1 day, the
      # shortest GitHub allows; only the job below reads it, minutes later.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-site
          path: |
            public
            public-fixtures
            tools
          if-no-files-found: error
          retention-days: 1

  lighthouse:
    needs: build
    runs-on: ubuntu-24.04
    # No token permissions: injected registry code can read every token of
    # its own job from process memory (ADR-0003 part 2).
    permissions: {}
    # ceil(2 x (T_setup + 18 pages x 3 runs x T_run)), ADR-0004 Numbers
    # ("lighthouse timeout"), re-derived in M4 PR 2 (#36, 2026-11-08) from
    # its three green runs on 16 pages (10 production pages with /a-z/
    # plus the 6 fixture pages with /a-z/index.html): runs 42498039107,
    # 42499352930 and 42500716363. Jobs took 549, 596 and 544 s, a spread
    # of 1.10, so the factor is 2. T_setup = job time minus its 48 audits
    # (48 x the mean audit), at most 30.4 s (job set up, artifact download,
    # resolve, digest, install, server start); T_run = the mean audit per
    # job, at most 11.8 s (single audits up to 35.0 s).
    # 2 x (30.4 + 54 x 11.8) s = 1335.2 s -> 23 min for 18 pages: Home, 404,
    # the eight static pages (with /a-z/ from M4 PR 2), the two production
    # section pages from M5 and the six fixture pages (ADR-0005 Numbers).
    # M5b PR 3 (Replikanti/interviewscam#13) adds the result pages /sent/
    # and /not-sent/, so 20 pages (ADR-0006 Numbers, "Lighthouse page
    # count 20"). M5b PR 3's green job on 18 pages (run 43544311814) took
    # 636 s for 54 audits, mean 11.1 s, so T_setup = 636 - 54 x 11.1 =
    # 36.6 s (the script's own setup line reads 26.4 s; the job time also
    # counts the start and the download); 20, not 18, because /reports/ and
    # /campaigns/ join from M5. One run gives no spread, so the factor stays 2, and each input
    # is the larger of that run and M4 PR 2's maxima:
    # 2 x (36.6 + 60 x 11.8) s = 1489.2 s -> 25 min.
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-site
      - name: bash tools/lighthouse.sh
        shell: bash
        run: bash tools/lighthouse.sh

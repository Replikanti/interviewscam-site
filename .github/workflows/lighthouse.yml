name: lighthouse

# The Lighthouse row of SPEC section 8, measured on the built site
# (ADR-0003). The registry code runs only in the job `lighthouse`: its
# GITHUB_TOKEN has no permissions, it has no checkout, and it sees only the
# artifact of `build` (public/, public-fixtures/ and tools/). Nothing on the
# deploy path reads what that job could write, and no workflow restores a
# cache.
#
# Not a required check (ADR-0003 part 4): it needs the public package
# registry on every run, and a registry outage must never block a removal
# PR. Agent sessions still never merge a PR whose run is red or pending.
on:
  pull_request:
    # The site-shaping paths, plus the fixture records the record templates
    # are measured on (ADR-0004 part 10). Record-only PRs are measured by
    # the push run on main after the merge.
    paths:
      - "layouts/**"
      - "assets/**"
      - "static/**"
      - "data/**"
      - "i18n/**"
      - "archetypes/**"
      - "content/*.md"
      - "hugo.toml"
      - "tools/**"
      - "tests/fixtures/records/pass-fixture-site/**"
      - ".github/workflows/lighthouse.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run's result moot.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Load-bearing job names: the guard reads this file, and ADR-0003 names
  # `build` and `lighthouse`.
  build:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": re-derived in M3 PR 7
    # (#29) from its own green runs of check.sh; the slowest, 245 s
    # (deploy.yml pages-artifact, run 42319886937, fix round 2, tree-1
    # first answer 1.25 s, so stall-free), sets both terms. Cap >= max(2 x
    # 245 s = 490 s, 245 s + 2 x 75 s (REFLOW_LAUNCH_TIMEOUT) + 70 s =
    # 465 s), rounded up to 9 min. Re-derive in the next PR that changes
    # check.sh.
    # It runs the same check.sh as the check job in ci.yml, plus the
    # artifact upload.
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh
      # The checked builds plus the check scripts, nothing else: no
      # content/, no history. public-fixtures/ is the fixture build of
      # check.sh (fixture records only, never deployed). Retention 1 day, the
      # shortest GitHub allows; only the job below reads it, minutes later.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-site
          path: |
            public
            public-fixtures
            tools
          if-no-files-found: error
          retention-days: 1

  lighthouse:
    needs: build
    runs-on: ubuntu-24.04
    # No token permissions: injected registry code can read every token of
    # its own job from process memory (ADR-0003 part 2).
    permissions: {}
    # ceil(2 x (T_setup + 16 pages x 3 runs x T_run)), ADR-0004 Numbers
    # ("lighthouse timeout"), from the six green runs of PR #23 on 13 pages
    # (8 production pages plus the 5 fixture pages, 2026-11-05; the QA
    # mutant runs left out). Jobs took 455 to 487 s, a spread of 1.07, so
    # the factor is 2. T_setup = job time minus its 39 audits, at most
    # 29.1 s (job set up, artifact download, resolve, digest, install,
    # server start); T_run = the mean audit per job, at most 11.8 s (single
    # audits up to 40.2 s). 2 x (29.1 + 48 x 11.8) s = 1191 s -> 20 min.
    # 16 pages: Home, 404, the seven static pages (with /data-feed/ from
    # M3 PR 5), the two production section pages from M5 and the five
    # fixture pages, so the value holds through M5.
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-site
      - name: bash tools/lighthouse.sh
        shell: bash
        run: bash tools/lighthouse.sh

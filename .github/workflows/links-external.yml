name: links-external

# External links, weekly and on manual start (ADR-0002 part 7). Not a
# required check: a third-party outage must never block a removal PR.
on:
  schedule:
    # Mondays 06:17 UTC; off the hour to avoid the scheduler's peak.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-external:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": derived from the job
    # duration, which timeout-minutes counts, last in M5b PR 2 fix round 5
    # (Replikanti/interviewscam#13): the slowest green job, 1533 s
    # (deploy.yml pages-artifact, run 43353246902), sets both terms.
    # Cap >= max(2 x 1533 s = 3066 s, 1533 s + 2 x 75 s
    # (REFLOW_LAUNCH_TIMEOUT) + 70 s = 1753 s), rounded up to 52 min.
    # Re-derive in the next PR that changes check.sh.
    # M3 has no external links to fetch yet (the fixture build's links stay
    # offline); revisit once milestone 5 adds sources.
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh --external
        shell: bash
        run: bash tools/check.sh --external

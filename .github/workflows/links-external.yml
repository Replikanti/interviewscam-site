name: links-external

# External links, weekly and on manual start (ADR-0002 part 7). Not a
# required check: a third-party outage must never block a removal PR.
on:
  schedule:
    # Mondays 06:17 UTC; off the hour to avoid the scheduler's peak.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-external:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": 2 x the slowest green
    # run of check.sh on PR #23 (M3 PR 4, the first with the fixture build),
    # rounded up to whole minutes. Green runs on 2026-11-05: check 161 s
    # (run 42095775647), lighthouse build 154 s (run 42095775227),
    # links-external 181 s (run 42095780993, a manual start on the branch);
    # spread 181 / 154 = 1.18, so the factor is 2: 2 x 181 s = 362 s ->
    # 7 min. Re-derive in the next PR that changes check.sh.
    # M3 has no external links to fetch yet (the fixture build's links stay
    # offline); revisit once milestone 5 adds sources.
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh --external
        shell: bash
        run: bash tools/check.sh --external

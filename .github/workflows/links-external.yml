name: links-external

# External links, weekly and on manual start (ADR-0002 part 7). Not a
# required check: a third-party outage must never block a removal PR.
on:
  schedule:
    # Mondays 06:17 UTC; off the hour to avoid the scheduler's peak.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-external:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": re-derived in M4 PR 4
    # (Replikanti/interviewscam#5) from its own green runs of check.sh
    # (reflow case (8), the hit test and paint check, 35 reflow-search rows,
    # 47 render-report rows); the slowest, 919 s (lighthouse.yml build, run
    # 42937840342, stall-free), sets both terms. Cap >= max(2 x 919 s =
    # 1838 s, 919 s + 2 x 75 s (REFLOW_LAUNCH_TIMEOUT) + 70 s = 1139 s),
    # rounded up to 31 min. Re-derive in the next PR that changes check.sh.
    # M3 has no external links to fetch yet (the fixture build's links stay
    # offline); revisit once milestone 5 adds sources.
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh --external
        shell: bash
        run: bash tools/check.sh --external

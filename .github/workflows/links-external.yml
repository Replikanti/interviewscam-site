name: links-external

# External links, weekly and on manual start (ADR-0002 part 7). Not a
# required check: a third-party outage must never block a removal PR.
on:
  schedule:
    # Mondays 06:17 UTC; off the hour to avoid the scheduler's peak.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-external:
    runs-on: ubuntu-24.04
    # 3x the first green run, rounded up to whole minutes (ADR-0003 part 5):
    # that run took 73 s (run 41931934799, 2026-11-04, a manual start on the
    # branch of PR #16 with the final reflow check), 3 x 73 s = 219 s ->
    # 4 min. M2 has no external links to fetch; revisit once milestone 5
    # adds sources.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh --external
        shell: bash
        run: bash tools/check.sh --external

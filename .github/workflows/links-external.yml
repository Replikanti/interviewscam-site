name: links-external

# External links, weekly and on manual start (ADR-0002 part 7). Not a
# required check: a third-party outage must never block a removal PR.
on:
  schedule:
    # Mondays 06:17 UTC; off the hour to avoid the scheduler's peak.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-external:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": derived from the job
    # duration, which timeout-minutes counts, on a bucketed base (M5b PR 2
    # fix rounds 9 and 10, Replikanti/interviewscam#13; re-derived in
    # Replikanti/interviewscam#40 PR 2, Replikanti/interviewscam#28 PR 2,
    # Replikanti/interviewscam#39 and twice in Replikanti/interviewscam#58):
    # the slowest green job, 3874 s (lighthouse.yml build, run 45487366958),
    # plus 46 s of drift, rounded up to the next 5-minute step, 4200 s, sets
    # both terms.
    # Cap >= max(2 x 4200 s = 8400 s, 4200 s + 2 x 75 s
    # (REFLOW_LAUNCH_TIMEOUT) + 70 s = 4420 s), so 140 min. Re-derive only
    # when a green job takes more than 4154 s.
    # M3 has no external links to fetch yet (the fixture build's links stay
    # offline); revisit once milestone 5 adds sources.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash tools/check.sh --external
        shell: bash
        run: bash tools/check.sh --external

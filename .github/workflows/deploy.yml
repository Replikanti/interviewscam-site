name: deploy

# Builds and uploads the Pages artifact only. Nothing here publishes: the
# token below can read the repo and nothing else, Pages stays disabled in the
# repo settings until M6 (#7), and M6 adds the deploy job deliberately.
on:
  push:
    branches: [main]
  # Proves this workflow on the PR that changes it.
  pull_request:
    paths: [.github/workflows/deploy.yml]

permissions:
  contents: read

# M6 must never cancel a deploy midway. Pushes to main share the group
# `pages`; each PR gets its own group, so a PR run can never replace a
# pending main run (a group keeps at most one pending run).
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('pages-pr-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  pages-artifact:
    runs-on: ubuntu-24.04
    # ADR-0004 Numbers, "check.sh workflow timeouts": re-derived in M3 PR 10
    # fix round 1 (#4) from its own green runs of check.sh (case (7) also
    # captures the skip link three times, 63 reflow fixtures); the slowest,
    # 370 s (ci.yml check, run 42448235548, stall-free), sets both terms.
    # Cap >= max(2 x 370 s = 740 s, 370 s + 2 x 75 s (REFLOW_LAUNCH_TIMEOUT)
    # + 70 s = 590 s), rounded up to 13 min. Re-derive in the next PR that
    # changes check.sh.
    # Same check.sh as the check job in ci.yml; a cap that is too low here
    # would block a deploy once M6 adds it.
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same entry point as the `check` job, so the uploaded artifact is
      # the checked build.
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh
      # retention-days stays at the action's default of 1: only M6's deploy
      # job in the same run will ever consume the artifact, and longer
      # retention only uses the plan's Actions storage.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

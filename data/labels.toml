# The "before your call" checklist (SPEC section 6), the single source for
# Home (titles only) and Before your call (titles and details), read through
# layouts/_partials/label-list.html. Plain text, no Markdown and no links:
# templates render it as text. The facts come from SPEC section 1; no entry
# names a company.
#
# The three headings, then the lists:
# [[checklist.warning]]      warning signs, shown with an orange warning tile
# [[checklist.instead]]      what to do instead, shown with a blue check tile
# [[checklist.already_ran]]  steps in the "if you already ran it" warning
#                            panel
# Each entry: `title` (required) and `detail` (optional, one paragraph).
[checklist]
warning_heading = "Warning signs"
instead_heading = "Do this instead"
already_ran_heading = "If you already ran it"

[[checklist.warning]]
title = "The meeting link arrives minutes before the call"
detail = "A link sent at the last moment leaves you no time to check the app or the company."

[[checklist.warning]]
title = "The call needs a meeting app you have never heard of"
detail = "The invite points to a new platform that wants you to download its own app. These apps change their name often, so a new name with no reports is no sign of safety."

[[checklist.warning]]
title = "You are asked to run a repo or a command"
detail = "A take-home coding test you must clone and run, or a command to paste into a terminal, can install an info-stealer. Some of these tests are written in JavaScript or Python, so Linux is at risk too."

[[checklist.warning]]
title = "There are installers only for Windows and macOS"
detail = "The Linux download is missing or does not work, or it serves the Windows build."

[[checklist.instead]]
title = "Ask to move the call to a tool you already use"
detail = "A real recruiter can switch to a meeting tool you already have, or to one that runs in the browser."

[[checklist.instead]]
title = "Search the company, the app and the domain first"
detail = "Look them up here and in a search engine before you install or run anything. A company with no footprint at all is a warning sign too."

[[checklist.instead]]
title = "Run test code only in a throwaway virtual machine"
detail = "Never on the computer that holds your passwords, wallets or SSH keys. Use a new virtual machine with no shared folders, no shared clipboard, no forwarded SSH agent and no accounts you care about signed in. Delete it afterwards."

[[checklist.instead]]
title = "Take your time"
detail = "Pressure to install something right now is part of how these scams work. A real interviewer can wait while you check."

[[checklist.already_ran]]
title = "Disconnect the computer from the network"
detail = "Keep it offline and do not sign in to anything on it."

[[checklist.already_ran]]
title = "From another device, change your passwords and end your sessions"
detail = "Start with email, GitHub, your password manager and Telegram. Sign out of every active session, because a stolen session works without the password."

[[checklist.already_ran]]
title = "Move funds from any wallet that computer could reach"
detail = "Send them to a new wallet created on a clean device."

[[checklist.already_ran]]
title = "Revoke SSH keys and API tokens"
detail = "Create new ones on a clean device."

[[checklist.already_ran]]
title = "Write down what you ran"
detail = "With the computer still offline, note the names and SHA-256 hashes of the files you ran or installed. Keep the messages, the meeting link and the repository or package name. The Report a scam page shows how to get a hash."

[[checklist.already_ran]]
title = "Report the invite"
detail = "Send what you noted from another device. Your report helps the next candidate who gets the same invite."

[[checklist.already_ran]]
title = "Reinstall the operating system"
detail = "Wait only until the file names and hashes are written down on paper or on another device. You do not need to send the report first. Do not use the computer for anything else until it is reinstalled."

# Every fixed public string of the templates under layouts/ (ADR-0004 part
# 13, SPEC section 5): the site chrome, the static and record page parts, the
# record wording and the checklist. A copy change is therefore a diff of this
# file, which the operator reviews as content (D7), and `sitecheck literals`
# fails on copy written anywhere else in the templates. The D6, D7 and D10
# strings are pinned a second time, independently, as constants in
# tools/sitecheck.py (the render check), so a change to them turns `render`
# red until the same change lands there too and shows up in a safety-net
# diff (ADR-0004 Consequences). Read only through
# layouts/_partials/label.html (one string) and label-list.html (a list of
# tables), never through .Site.Data.
#
# Strings with %s or %d are printf formats: the template fills in the name,
# the count or the date, in that order. Templates print every string through
# Hugo's HTML escaping, so a string here is plain text, never markup.

# The site itself. description is the <meta name="description"> of every
# page without its own description front matter (SPEC section 8: the
# Lighthouse SEO category).
[site]
description = "A community registry of fake job-interview scams that target developers."
skip_link = "Skip to content"

# The header on every page: the wordmark (name and its ".com" part), the one
# call to action and the main nav.
[header]
brand = "interviewscam"
brand_tld = ".com"
cta = "Report a scam"
nav_label = "Main"
nav_before_your_call = "Before your call"
nav_methodology = "Methodology"
nav_about = "About"

# The footer on every page. run_by comes before the operator's name
# (params.operator in hugo.toml, D1).
[footer]
run_by = "Run by"
nav_label = "Site"
methodology = "Methodology"
corrections = "Corrections and removal"
privacy = "Privacy"
# The link to /data-feed/, the documentation of /feed.json (SPEC section 6).
data_feed = "Data feed"
promise = "No trackers, no cookies, no third-party scripts."

# The Copy button after every artifact box and the contact address
# (layouts/_partials/copy-button.html, ADR-0004 part 11): button is its text;
# done and failed are the statuses assets/js/copy.js writes into the polite
# live region after the button once the copy succeeded or failed. The
# script reads them from the button's data-copy-done and data-copy-failed
# attributes, so it holds no copy itself.
[copy]
button = "Copy"
done = "Copied"
failed = "Copy failed, select the text instead"

# The 404 page. title is the h1 and, with " · interviewscam.com", the
# <title>.
[not_found]
title = "Page not found"
text = "There is no page at this address."
home_link = "Go to the home page"
report_link = "Report a scam"

# Home. title is the h1 and, with " · interviewscam.com", the <title>.
[home]
title = "Check a name from your interview invite"
lead = "Got a meeting link or a coding test from a recruiter you do not know? Look up the company, the app or the domain before you install or run anything."
search_label = "Company, app, domain or recruiter"
search_button = "Check"
checklist_heading = "Before your call"
checklist_link = "The full checklist"
already_ran_link = "Already ran it? What to do now"
latest_heading = "Latest reports"
latest_link = "All names"
families_heading = "Campaign families"
families_link = "All campaign families"

# The A to Z page /a-z/ (layouts/_partials/a-z.html and index-item.html,
# ADR-0005 part 2): campaign_type is the type of a campaign family's entry
# (a report's entry shows its name_type); browse_link is the link to /a-z/
# in the Home search card, visible with and without JavaScript.
[a_z]
campaign_type = "Campaign family"
browse_link = "Browse every report A to Z"

# The no-report block (layouts/_partials/no-report.html, ADR-0005 part 4):
# no entry is never a sign of safety. browse_text follows the A to Z list
# of /a-z/, which shows every report by its name and its other names but
# no artifact and no hidden name, so it states only what the list holds
# (wording approved by the operator at STOP 2 of #36, D7). It is pinned a second time in tools/sitecheck.py
# (NO_REPORT_BROWSE_TEXT, render rule 15), and so are the two link texts,
# so a change turns render red until the same change lands there too.
[no_report]
browse_text = "Not finding a name here does not mean it is safe. This list shows each report by its name and its other names. Apart from those names, it does not show the addresses, handles and files listed inside a report, or names hidden on request. New fake interviews also use names nobody has reported yet."
before_link = "Before your call"
report_link = "Report a scam"

# How to send a report or a correction request today
# (layouts/_partials/how-to-send.html): the address as plain text and the
# fixed subject line of each channel.
[how_to_send]
heading = "How to send it"
address = "Email address"
subject = "Subject line"

[how_to_send.subjects]
report = "Report: <name of the company, app or person>"
correction = "Correction: <page URL>"

# The breadcrumb of record and section pages: the label of its <nav> and the

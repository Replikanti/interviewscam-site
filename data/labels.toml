# The two D6 states: the chip (neutral blue, chip_text on chip_bg, never
# orange) and the sentence under the h1 of a report page.
[state.name_abused]
chip = "Name abused"
sentence = "This name belongs to someone else. The campaign used it without their involvement."

[state.front]
chip = "Front"
sentence = "No real company, person or product was found behind this name."

[persona]
# D10: rendered in brackets right after every visible persona name or alias
# (layouts/_partials/record-name.html), in the h1, the lists and JSON-LD.
# The one exception is the <title> of the persona's own page, which puts
# the label first (label_first, title.persona_head; SPEC section 5,
# ADR-0004 part 4). Its meta description is the summary, with neither the
# name nor the label.
label = "(name used by the campaign, possibly a stolen identity)"
# The label first, word for word and capitalised as the start of a
# sentence; %s is the name.
label_first = "Name used by the campaign, possibly a stolen identity: %s"
# The display name of a persona record with params.hide_name = true
# (ADR-0004 part 5).
hidden_name = "Name hidden on request"
# The notice on that page; the template adds the link to Corrections and
# removal.
hidden_notice = "The person named on this page asked for the name to be hidden. It stays hidden while the request is reviewed."

# Page titles (h1, and <title> plus " · interviewscam.com").
[title]
report = "%s, a name used in fake job interviews"
# The <title> of a visible persona's own page; %s is the name in the
# label-first form (persona.label_first). The h1 keeps title.report.
persona_head = "%s"
hidden = "A person's name used in fake job interviews, hidden on request"
campaign = "%s, a campaign family that uses fake job interviews"
reports = "Names used in fake job interviews"
campaigns = "Campaign families"

# The D7 label: facts, never a verdict. %d is params.independent_reports
# (or the number of cited sources), %s is params.last_reviewed.
[label]
reported = "Reported %d times, evidence reviewed on %s"
reported_once = "Reported once, evidence reviewed on %s"
one_source = "Named in 1 cited source, reviewed on %s"
sources = "Named in %d cited sources, reviewed on %s"


# The link preview card images (SPEC section 6, ADR-0009 parts 4 to 6).
# layouts/_partials/preview-image.html draws each card with the pinned Hugo
# from these numbers, and layouts/_partials/preview-wrap.html breaks its
# lines from the tables below the generated mark. Every number here comes
# from ADR-0009 Numbers, where each one states its source and what breaks
# at another value. The layout tables are hand-written; the guard holds
# them to these keys, positive integers, a 1200 x 630 canvas and a margin
# that holds X's 15 px crop and the ink slack.

[canvas]
# The card: 1200 x 630 px (1.91:1, the size Meta recommends; X's 2:1 large
# card crops 15 px at the top and the bottom).
width = 1200
height = 630
# The blank margin on every side, 15 px crop plus the ink slack (16 px)
# with room to spare; the left one holds the bar.
margin = 56
# The primary-colour bar at the left edge, inside the margin.
bar = 16
# The space between two blocks of text, about half a 36 px line pitch.
gap = 24

[site]
# The site card: the brand, then the site description.
brand_size = 72
description_size = 40

# Generated by `python3 -I tools/sitecheck.py preview-metrics`. Do not edit below this line; the guard compares it with that output.

[face.regular]
units_per_em = 1000
ascender = 1069
descender = -293
line_gap = 0
ink_slack = 16

[face.bold]
units_per_em = 1000
ascender = 1069
descender = -293
line_gap = 0
ink_slack = 16


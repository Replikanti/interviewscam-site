name: deploy

# Builds and uploads the Pages artifact only (D4, ADR-0007 part 1): the
# token below can read the repo and nothing else, Pages stays off until M6
# (Replikanti/interviewscam#7), and M6 adds the deploy job deliberately.
on:
  push:
    branches: [main]
  # Proves this workflow on the PR that changes it, a pin bump included.
  pull_request:
    paths: [.github/workflows/deploy.yml]

permissions:
  contents: read

# M6 must never cancel a deploy midway. Pushes to main share the group
# `pages`; each PR gets its own group, so a PR run can never replace a
# pending main run.
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('pages-pr-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  pages-artifact:
    runs-on: ubuntu-24.04
    # ADR-0007 Numbers, "Private timeout": 10 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: records
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Replikanti/interviewscam-site
          ref: 0123456789abcdef0123456789abcdef01234567
          path: site
      # The same records-mode check as the job check, so the uploaded
      # artifact is the checked build.
      - name: bash site/tools/check.sh --records records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash site/tools/check.sh --records records
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

name: lighthouse

# The Lighthouse row of SPEC section 8 on the production pages built from
# the real records (ADR-0003, ADR-0007 part 5). The registry code runs only
# in the job `lighthouse`: its GITHUB_TOKEN has no permissions, it has no
# checkout, and it sees only the artifact of `build` (public/ and tools/ of
# the public checkout).
#
# Not a required check (ADR-0003 part 4). Weekly and on manual start, not
# on every push to main (ADR-0007 part 6): Pages is off until M6, and the
# records grow one PR at a time, so a budget breach shows up gradually.
# The job build also re-checks main's records weekly. No concurrency
# group: a dispatch never cancels the weekly run.
on:
  schedule:
    # Mondays 07:47 UTC, 90 minutes after links-external (06:17, at most
    # 10 minutes), off the hour to avoid the scheduler's peak.
    - cron: "47 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Load-bearing job names: the guard reads this file, and ADR-0003 names
  # `build` and `lighthouse`.
  build:
    runs-on: ubuntu-24.04
    # ADR-0007 Numbers, "Private timeout": 10 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: records
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Replikanti/interviewscam-site
          ref: 0123456789abcdef0123456789abcdef01234567
          path: site
      # The job token of `build` (contents: read) reads the pin's check run
      # and compare, as in the job check: anonymous reads share 60 an hour
      # per runner address. check.sh unsets it right after the pin step,
      # and GitHub revokes it when `build` ends, before `lighthouse` starts.
      - name: bash site/tools/check.sh --records records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash site/tools/check.sh --records records
      # The checked production build plus the check scripts, nothing else:
      # no records source, no history. Retention 1 day, the shortest
      # GitHub allows.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-site
          path: |
            site/public
            site/tools
          if-no-files-found: error
          retention-days: 1

  lighthouse:
    needs: build
    runs-on: ubuntu-24.04
    # No token permissions: injected registry code can read every token of
    # its own job from process memory (ADR-0003 part 2).
    permissions: {}
    # ADR-0007 Numbers, "Private timeout of lighthouse": 2 x (36.6 + 42 x
    # 11.8) s = 1064.4 s, so 18 min.
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-site
      - name: bash tools/lighthouse.sh --records
        shell: bash
        run: bash tools/lighthouse.sh --records

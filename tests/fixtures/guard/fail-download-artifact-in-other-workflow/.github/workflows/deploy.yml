name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pages-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-site
      - name: bash tools/check.sh
        shell: bash
        run: bash tools/check.sh
